name: Tests
on: [push, pull_request]
permissions:
  contents: read
env:
  # PyBoy RS is not on PyPI yet, so CI builds it from this exact commit of afk-sapien/pyboy-rs
  # (the 0.1.1 release candidate: RTC, clock lock, host-following export, cross-build checkpoints). Replace with the
  # published release once pyboy-rs>=0.1.1 is on PyPI.
  PYBOY_RS_SHA: cf6875184c4bb8c7010306c258f4eb42352781b4
jobs:
  test:
    name: pure Python (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync --python ${{ matrix.python }} ruff check .
      - run: uv run --no-sync --python ${{ matrix.python }} pytest
      - run: uv build

  emulator:
    name: emulator and RTC (PyBoy RS wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: afk-sapien/pyboy-rs
          ref: ${{ env.PYBOY_RS_SHA }}
          path: pyboy-rs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable branch
        with:
          toolchain: stable
      - name: Build the PyBoy RS wheel
        run: |
          python -m pip install maturin
          (cd pyboy-rs && maturin build --release --locked --out "$GITHUB_WORKSPACE/dist")
      - name: Install Core with the emulator
        run: |
          python -m pip install dist/pyboy_rs-*.whl
          python -m pip install -e ".[dev]" pillow numpy
      - name: Require clock control in the built wheel
        run: python -c "import pyboy_rs; assert pyboy_rs.HAS_CLOCK_CONTROL, pyboy_rs.FEATURES"
      - name: Run the emulator, RTC and checkpoint suites without silent skips
        run: |
          python -m pytest -rs -q --ignore=tests/test_snapshot_native.py | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "Unexpected skips"; exit 1; fi
      - run: ruff check src tests tools

  native:
    name: native decoder crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml -- -D warnings
      - name: Build and install the decoder wheel
        run: |
          python -m pip install maturin
          maturin build --release --manifest-path native/Cargo.toml --out dist
          python -m pip install dist/pokesim_core_native-*.whl
          python -m pip install -e ".[dev]"
      - name: Run the decoder tests against the Rust decoder
        run: |
          POKESIM_CORE_DECODER=rust python -m pytest -rs -q tests/test_snapshot_native.py | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "Unexpected skips"; exit 1; fi

  compatibility:
    name: 0.1.x surface without an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install only the built wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv clean
          clean/bin/python -m pip install dist/pokesim_core-*.whl pytest
          clean/bin/python -c "import importlib.util as u; assert u.find_spec('pyboy_rs') is None and u.find_spec('pyboy') is None"
      - name: Import the surface PokeBench uses and run the tests that need no emulator
        run: |
          clean/bin/python tools/check_legacy_surface.py
          clean/bin/python -m pytest -q -p no:cacheprovider
