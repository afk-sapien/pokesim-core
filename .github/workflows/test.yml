name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync --python ${{ matrix.python }} ruff check .
      - run: uv run --no-sync --python ${{ matrix.python }} pytest
      - run: uv build
