name: Release

# A pushed tag v* builds the wheel, runs the tests and attaches the wheel to the
# GitHub release for that tag (created from the CHANGELOG if missing). Nothing is
# published to PyPI. A manual run is a dry run: it builds and tests, and uploads the
# wheel as a workflow artifact only; it never touches a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test the wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - id: meta
        name: Read the version and check the tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          fi
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - run: uv build --wheel --out-dir dist
      - name: Check the wheel
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          test "$(ls dist)" = "pokesim_core-$version-py3-none-any.whl" || { ls dist; exit 1; }
          python3 -m venv clean
          clean/bin/python -m pip install dist/pokesim_core-*.whl
          clean/bin/python -c "import pokesim_core"
          (cd dist && sha256sum *) | tee SHA256.txt
          { echo '### SHA-256'; echo '```'; cat SHA256.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pokesim-core-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: attach the wheel to the GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pokesim-core-wheel
          path: dist
      - name: Create the release if missing and upload the wheel
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version"; exit 1; }
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Drafted first and published after the upload, so it is never public without its wheel.
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
