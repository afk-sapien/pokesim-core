[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pokesim-core"
version = "0.2.0.dev0"
description = "Shared read-only Pokemon Red and Blue decoding and emulator primitives"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
emulator = ["pyboy-rs==0.1.0", "pillow>=10,<13"]
acceleration = ["pokesim-core-native==0.1.0.dev0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/afk-sapien/pokesim-core"
Issues = "https://github.com/afk-sapien/pokesim-core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokesim_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.uv.sources]
pyboy-rs = { path = "../pyboy-rs" }
pokesim-core-native = { path = "native" }
